name: Vortex CareerOS Canary Candidate Build

on:
  pull_request:
    branches:
      - hardening/vortex-ado-hitl-cognitive-20260919
    paths:
      - 'vortex/decision/careeros_invitation_canary_adapter.py'
      - 'services/decision-api/app.py'
      - 'tests/test_decision_api_service.py'
      - 'Dockerfile.vortex'
      - '.github/workflows/vortex-careeros-canary-candidate-build.yml'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  AWS_ACCOUNT_ID: "592755832023"
  ECR_REGISTRY: 592755832023.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: finbridge/vortex-customerzero
  AWS_ROLE_ARN: arn:aws:iam::592755832023:role/finbridge/customer-zero/FinBridgeVortexGithubActionsCustomerZeroRole

jobs:
  validate-build-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Freeze exact source identity
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git status --porcelain)" = ""
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install -r services/decision-api/requirements.txt

      - name: Compile bounded CareerOS runtime
        run: |
          python -m py_compile \
            vortex/decision/reference_engine.py \
            vortex/decision/seos_adapter.py \
            vortex/decision/careeros_invitation_canary_adapter.py \
            services/decision-api/app.py

      - name: Run full Vortex unit and falsification suite
        run: python -m pytest -q

      - name: Verify CareerOS canary stays non-executing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          text=pathlib.Path("vortex/decision/careeros_invitation_canary_adapter.py").read_text()
          app=pathlib.Path("services/decision-api/app.py").read_text()
          for marker in [
              'TOOL_NAME = "aug_business_effect"',
              'ACTION_TYPE = "career.invitation.create_and_enqueue"',
              'CANARY_RECIPIENT = "customer-zero-test@example.invalid"',
              'CANARY_ROLE = "member"',
              '"execution_authority": False',
              'mandatory_human_review must be true',
          ]:
              assert marker in text, marker
          assert '/v1/decision/careeros-invitation-canary' in app
          assert 'VORTEX_ENABLE_CAREEROS_INVITATION_CANARY' in app
          print("VORTEX_CAREEROS_CANDIDATE_BOUNDARY=PASS")
          PY

      - name: Build exact-source image
        run: |
          set -euo pipefail
          docker build \
            -f Dockerfile.vortex \
            --build-arg SOURCE_GIT_SHA="$SOURCE_SHA" \
            -t "vortex-runtime:$SOURCE_SHA" \
            .

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: vortex-careeros-candidate-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push immutable exact-SHA candidate
        shell: bash
        run: |
          set -euo pipefail
          remote="$ECR_REGISTRY/$ECR_REPOSITORY:$SOURCE_SHA"
          docker tag "vortex-runtime:$SOURCE_SHA" "$remote"
          push_output="$(docker push "$remote")"
          printf '%s\n' "$push_output"
          digest="$(printf '%s\n' "$push_output" | sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | tail -1)"
          test "${#digest}" -eq 71
          test "${digest#sha256:}" != "$digest"
          echo "VORTEX_CANDIDATE_SOURCE_SHA=$SOURCE_SHA"
          echo "VORTEX_CANDIDATE_TREE_SHA=$SOURCE_TREE"
          echo "VORTEX_CANDIDATE_IMAGE_DIGEST=$digest"
          echo "VORTEX_CANDIDATE_ECS_MUTATION=NONE"
