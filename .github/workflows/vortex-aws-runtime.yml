name: Vortex AWS Runtime CI

on:
  push:
    branches:
      - hardening/vortex-aws-runtime-b7fcfa6
  pull_request:
    branches:
      - vortex/library-recovery-v0.2-v0.8-canonical
      - hardening/vortex-aws-runtime-b7fcfa6

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 592755832023.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: finbridge/vortex-customerzero
  AWS_ROLE_ARN: arn:aws:iam::592755832023:role/finbridge/customer-zero/FinBridgeVortexGithubActionsCustomerZeroRole

jobs:
  validate-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Vortex runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install -r services/decision-api/requirements.txt

      - name: Compile runtime boundary
        run: |
          python -m py_compile vortex/decision/reference_engine.py vortex/decision/seos_adapter.py
          python -m py_compile services/decision-api/app.py

      - name: Run reference core and service contract tests
        run: python -m pytest -q

      - name: Build exact-source image
        run: |
          docker build \
            -f Dockerfile.vortex \
            --build-arg SOURCE_GIT_SHA="${GITHUB_SHA}" \
            -t "vortex-runtime:${GITHUB_SHA}" \
            .

      - name: Configure AWS OIDC credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: vortex-runtime-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push immutable exact-SHA image
        if: github.event_name == 'push'
        run: |
          remote="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker tag "vortex-runtime:${GITHUB_SHA}" "$remote"
          docker push "$remote"
          echo "VORTEX_SOURCE_GIT_SHA=${GITHUB_SHA}"
          echo "VORTEX_IMAGE=$remote"
