name: Vortex Reference Core CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'vortex/**'
      - 'schemas/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/reference-core-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile reference core
        run: python -m py_compile vortex/decision/reference_engine.py
      - name: Run unit and falsification tests
        run: python -m pytest -q
