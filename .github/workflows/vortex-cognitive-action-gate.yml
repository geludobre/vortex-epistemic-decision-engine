name: Vortex ADO Cognitive Action Gate

on:
  push:
    branches:
      - 'hardening/vortex-ado-cognitive-action-20260918'

permissions:
  contents: read

jobs:
  cognitive-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact live-source ancestry
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 'ed9b4202ca1ccd6a2de33fc9bc26f093ed40f3f7^{commit}'
          git merge-base --is-ancestor ed9b4202ca1ccd6a2de33fc9bc26f093ed40f3f7 "${GITHUB_SHA}"

      - name: Install runtime test dependencies
        run: |
          python -m pip install -e '.[test]'
          python -m pip install -r services/decision-api/requirements.txt

      - name: Compile cognitive runtime boundary
        run: |
          python -m py_compile             vortex/decision/reference_engine.py             vortex/decision/seos_adapter.py             vortex/decision/cognitive_adapter.py             services/decision-api/app.py

      - name: Run full Vortex unit and falsification suite
        run: python -m pytest -q

      - name: Verify cognitive operator remains non-executing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          text=pathlib.Path("vortex/decision/cognitive_adapter.py").read_text()
          assert 'COGNITIVE_ACTION_TYPE = "ado.dispatch"' in text
          assert '"execution_authority": False' in text
          assert 'autonomy_override must be exactly 0' in text
          assert 'cognitive_output_only' in text
          print("VORTEX_COGNITIVE_NON_EXECUTING_BOUNDARY=PASS")
          PY
